# config.yaml

# Data
main_var_data_directory: "/input/main_var/"
env_var_data_directory: "/input/lifted_index/"
detection_output_path: "/output/detection/"
raw_tracking_output_dir: "/output/tracking_raw"
filtered_tracking_output_dir: "/output/tracking/"

main_var_name: "precipitation"
env_var_name: "LI"
main_var_filename_template: "main_YYYYMMDDTHHMM.nc"
env_var_filename_template: "env_YYYYMMDDTHHMM.nc"
lat_name: "rlat"  # Name of the 1D y coordinate in the input data
lon_name: "rlon" # Name of the 1D x coordinate in the input data
data_source: "Description of your source data"
dt_hours: 0.5  # Time step resolution in hours (0.5 for 30-min data, 1.0 for hourly data)

# Years and Months to process
# empty list uses all available data in the specified directory
years: []
months: [5, 6, 7, 8, 9]

# Detection parameter
detection: True
detection_parameters:
  use_env_var: True
  min_size_threshold: 10  # min number of grid cells for an object to be detected
  core_threshold: 6.8  # mm/h
  main_var_operator: ">="  # ">=" for precip/CAPE, "<=" for Tb/LI
  env_var_operator: "<="   # "<=" for LI, ">=" for CAPE
  envelope_threshold: 1.0
  min_nr_plumes: 1  # number of heavy precipitation plums
  env_var_percentage_threshold: 0.1
  env_var_threshold: -2  # K

# Tracking parameter
tracking: True
tracking_parameters:
  main_lifetime_thresh_hours: 4  # min number of hours for an MCS in the mature state
  main_area_thresh: 3500  # min area for a system to be in the mature state
  nmaxmerge: 5  # maximum number of objects to merge in a single timestep

# Post-processing / Filtering
# This section controls the physics-based filtering logic
postprocessing: True
postprocessing_filters:
  env_var_operator: "<="          # Comparison operator for environmental check in postprocessing
  env_var_threshold: 1.5          # Keep systems with mean LI < 0.0 K
  track_straightness_threshold: 0.4    # Keep systems with straightness > 0.4
  max_area_volatility: 90000.0        # Keep systems with max volatility < 0.9e5

# Other parameter
use_multiprocessing: True
number_of_cores: 20
